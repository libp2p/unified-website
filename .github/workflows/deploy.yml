name: Deploy to EC2

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # Publish data refreshed by the scheduled content workflows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          ZOLA_VERSION=0.23.6
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xzf - -C /usr/local/bin
          zola --version

      - name: Generate version file
        run: |
          mkdir -p ./static/data
          TZ=UTC git show -s --date=iso-local --format='%h %cd' HEAD > ./static/data/version

      - name: Build Zola site
        env:
          LIBP2P_DOMAIN: ${{ vars.LIBP2P_DOMAIN }}
        run: |
          test -n "$LIBP2P_DOMAIN" || { echo "Set repository variable LIBP2P_DOMAIN"; exit 1; }
          zola build --base-url="https://${LIBP2P_DOMAIN}/"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public/

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_SSH_PRIVATE_KEY" || { echo "Set secret EC2_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$EC2_KNOWN_HOSTS" || { echo "Set secret EC2_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy release and switch live site
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH }}
        run: |
          test -n "$EC2_HOST" || { echo "Set repository variable EC2_HOST"; exit 1; }
          test -n "$EC2_USER" || { echo "Set repository variable EC2_USER"; exit 1; }
          test -n "$EC2_DEPLOY_PATH" || { echo "Set repository variable EC2_DEPLOY_PATH"; exit 1; }
          RELEASE_PATH="$EC2_DEPLOY_PATH/releases/$GITHUB_SHA"
          SSH_CMD="ssh -i $HOME/.ssh/id_ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          $SSH_CMD "$EC2_USER@$EC2_HOST" "mkdir -p '$RELEASE_PATH'"
          rsync -az --delete \
            -e "$SSH_CMD" \
            public/ "$EC2_USER@$EC2_HOST:$RELEASE_PATH/"
          $SSH_CMD "$EC2_USER@$EC2_HOST" \
            "ln -sfn '$RELEASE_PATH' '$EC2_DEPLOY_PATH/current.next' && mv -Tf '$EC2_DEPLOY_PATH/current.next' '$EC2_DEPLOY_PATH/current'"

      - name: Announce production deployment
        run: echo "::notice title=Production Deployed::${{ github.sha }}"
