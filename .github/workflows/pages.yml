name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress Pages deploy; queue the next one instead
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Zola
        run: |
          ZOLA_VERSION=0.22.0
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xzf - -C /usr/local/bin
          zola --version

      - name: Generate version file
        run: |
          mkdir -p ./static/data
          TZ=UTC git show -s --date=iso-local --format='%h %cd' HEAD > ./static/data/version

      # base_url follows the Pages custom domain once one is set,
      # and is https://libp2p.github.io/unified-website until then
      - name: Build Zola site
        run: zola build --base-url="${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Announce production deployment
        run: |
          echo "::notice title=GitHub Pages Deployed::${{ steps.deployment.outputs.page_url }}"
